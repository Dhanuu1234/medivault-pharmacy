services:
  - type: web
    name: medivault-pharmacy
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn pharmacy.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        fromDatabase:
          name: medivault-db
          property: connectionString

databases:
  - name: medivault-db
    plan: free
